[project]
name = "gcagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    "langchain-google-vertexai>=2.0.0",
    "langchain-google-community[bigquery]>=2.0.0",
    "google-cloud-aiplatform>=1.60.0",
    "fastmcp>=3.0.0",
    "python-dotenv>=1.0.0",
    "langchain-mcp-adapters>=0.2.2",
    "chronos-forecasting[torch]>=2.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Use.*ChatGoogleGenerativeAI:DeprecationWarning",
]
